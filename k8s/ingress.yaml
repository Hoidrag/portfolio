apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  name: bx-samuelhoidrag-com-ingress
  namespace: bx-shared
spec:
  ingressClassName: traefik
  rules:
    - host: samuelhoidrag.com
      http:
        paths:
          - backend:
              service:
                name: bx-samuelhoidrag-com
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - samuelhoidrag.com
      secretName: bx-samuelhoidrag-com-tls
