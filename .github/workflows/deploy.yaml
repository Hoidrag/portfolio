name: Build & Deploy to k3s (Docker Hub)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  DOCKER_REPO: bixag/private
  KUBE_NAMESPACE: bx-shared

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::7}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:samuelhoidrag-com-${{ steps.tags.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy manifests
        env:
          NS: ${{ env.KUBE_NAMESPACE }}
          IMAGE: ${{ env.DOCKER_REPO }}:samuelhoidrag-com-${{ steps.tags.outputs.sha }}
        run: |
          export NS IMAGE
          envsubst < k8s/deploy.yaml  | kubectl apply -n "$NS" -f -

          # Apply the services
          kubectl apply -n "$NS" -f k8s/svc.yaml

          # Apply the ingress
          kubectl apply -n "$NS" -f k8s/ingress.yaml

          # Wait for rollout
          kubectl rollout status deployment/bx-samuelhoidrag-com -n "$NS"
